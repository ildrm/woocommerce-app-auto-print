name: Verify AutoPrint
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev
      - run: npm ci
      - run: node scripts/fetch-runtime.mjs
      - run: python scripts/fetch-fonts.py
      - run: npm run verify
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --exclude autoprint-desktop
      - run: cargo clippy --workspace --exclude autoprint-desktop --all-targets -- -D warnings
      - run: npm audit --audit-level=moderate
      - run: node scripts/check-translations.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ runner.os }}
          path: apps/desktop/dist
